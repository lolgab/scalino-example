name: Release

# Cross-compiles from a single Linux runner to Linux, macOS and Windows
# (x86_64 + aarch64) using scalino's --native-target-triple.
# Requires scalino >= 0.0.18.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  TRIPLES: >-
    x86_64-unknown-linux-gnu,
    aarch64-unknown-linux-gnu,
    x86_64-apple-darwin,
    aarch64-apple-darwin,
    x86_64-pc-windows-gnu,
    aarch64-pc-windows-gnu

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install scalino (apt)
        run: |
          curl -fsSL https://lolgab.github.io/scalino/scalino-signing-key.pub.asc | sudo gpg --dearmor -o /usr/share/keyrings/scalino.gpg
          echo "deb [signed-by=/usr/share/keyrings/scalino.gpg] https://lolgab.github.io/scalino/apt stable main" | sudo tee /etc/apt/sources.list.d/scalino.list
          sudo apt update
          sudo apt install -y scalino=0.0.18 lld

      - name: Cross-compile
        run: |
          scalino package --native-mode release-fast \
            --native-target-triple "$(echo "$TRIPLES" | tr -d ' ')" \
            -o dist/hello
          ls -l dist

      - name: Archive
        run: |
          cd dist
          for f in hello-*; do
            case "$f" in
              *.exe) zip "${f%.exe}.zip" "$f" ;;
              *) tar czf "$f.tar.gz" "$f" ;;
            esac
            rm "$f"
          done
          sha256sum * > SHA256SUMS
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
